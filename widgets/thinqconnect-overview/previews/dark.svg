  <text x="22" y="122" fill="#bdc9d9" font-family="system-ui" font-size="10">PM2.5</text>
  <text x="22" y="141" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="750">6.2 µg/m³</text>
  <rect x="210" y="106" width="192" height="42" rx="11" fill="#172033" stroke="#334155"/>
  <text x="220" y="122" fill="#bdc9d9" font-family="system-ui" font-size="10">Filter</text>
  <text x="220" y="141" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="750">74 %</text>
