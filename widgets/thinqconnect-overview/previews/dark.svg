<svg xmlns="http://www.w3.org/2000/svg" width="414" height="160" viewBox="0 0 414 160" role="img" aria-label="Compact LG appliance status preview in dark mode">
  <rect width="414" height="160" rx="16" fill="#0f172a"/>
  <rect x="12" y="10" width="32" height="32" rx="10" fill="#a50034"/>
  <text x="28" y="31" fill="#fff" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="800">LG</text>
  <text x="54" y="30" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700">Air purifier</text>
  <rect x="12" y="50" width="192" height="50" rx="11" fill="#172033" stroke="#334155"/>
  <text x="22" y="68" fill="#bdc9d9" font-family="system-ui" font-size="10">Temperature</text>
  <text x="22" y="89" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="750">23.5 °C</text>
